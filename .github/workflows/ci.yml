name: SatQuery AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Regression & Geospatial Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Geospatial Dependencies (GDAL, PROJ, GEOS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libgdal-dev \
            libproj-dev \
            libgeos-dev \
            curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov reportlab

      - name: Run Full Test Suite
        env:
          ALLOW_GPU: "false"
          DEFAULT_CRS: "EPSG:4326"
        run: |
          python -m pytest tests/test_change_pipeline.py \
            tests/test_geospatial_foundation.py \
            tests/test_ai_core_specialists.py \
            tests/test_multimodal_physics_judge.py \
            tests/test_data_infrastructure.py \
            tests/test_reports.py \
            tests/test_security_sanitizer.py \
            tests/agent \
            backend/tests \
            --durations=10

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: satquery-ai:ci-test
