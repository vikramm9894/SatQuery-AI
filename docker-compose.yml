version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: satquery-ai:latest
    container_name: satquery-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOW_GPU=true
      - DEFAULT_CRS=EPSG:4326
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///app/storage/satquery.db
    volumes:
      - satquery_storage:/app/storage
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: satquery-ai:latest
    container_name: satquery-worker
    command: ["python", "-m", "satquery.queue.dispatcher"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///app/storage/satquery.db
    volumes:
      - satquery_storage:/app/storage
    depends_on:
      - redis
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: satquery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: satquery-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  satquery_storage:
  redis_data:
